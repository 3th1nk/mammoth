# goreleaser release pipeline (docs/09-roadmap.md M6: CLI, goreleaser 分发).
# Release: git tag vX.Y.Z && goreleaser release --clean
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mammoth
    main: ./cmd/mammoth
    binary: mammoth
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/3th1nk/mammoth/internal/version.Version={{.Version}}
        -X github.com/3th1nk/mammoth/internal/version.Commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: "mammoth_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  groups:
    - title: 新特性
      regexp: '^feat[(:]'
      order: 0
    - title: 修复
      regexp: '^fix[(:]'
      order: 1
    - title: 其他
      order: 999
  filters:
    # 仓库提交带 scope(docs(03-api):/chore(deps):),裸 ^docs: 匹配不到——
    # 必须 [(:] 双收(v1.3.0 发布体 384 行的另一根因)。
    exclude:
      - "^docs[(:]"
      - "^chore[(:]"
      - "^ci[(:]"
      - "^test[(:]"
      - "^build[(:]"
      - "^Merge pull request"
