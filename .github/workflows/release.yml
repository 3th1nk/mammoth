# Release: binaries + archives via goreleaser (docs/09-roadmap.md M6).
# Triggered by version tags.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # checkout 默认 --no-tags 且只拉触发的那一个 tag——goreleaser 需要
          # 全部历史 tag 才能解析 previous(<unknown> 会让 changelog 区间退化
          # 成全仓历史,v1.3.0 的 384 行发布体就是这一坑的产物)。
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
