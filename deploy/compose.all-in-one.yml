# Topology 1: all-in-one — single mammoth (all facets) + PostgreSQL.
# Evaluation / small-scale deployments.
#
# Media export: the BMC-compatible NFS server is a KERNEL nfsd (real-hardware
# verdict, docs/compat/huawei.md §6) — either the host's own nfs-server
# (docs/operations.md §4.7 checklist) or the `nfsd` sidecar below, which
# manages the host kernel nfsd from a privileged container. Enable it with
#   docker compose --profile nfs up -d
# The engine's in-process NFS export (nfsx) is opt-in for unprivileged
# evaluation only — BMCs and subpath-mounting installers need a
# path-resolving server (MAMMOTH_NFS_EXPORT=true + port mappings).
name: mammoth
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mammoth
      POSTGRES_PASSWORD: mammoth
      POSTGRES_DB: mammoth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mammoth -d mammoth"]
      interval: 2s
      timeout: 2s
      retries: 15

  mammoth:
    build:
      context: ..
      # Builder image (alpine + xorriso/wimlib/7z), NOT distroless: media
      # assembly shells out to those tools (bootiso.go), and mode=all runs
      # it in-process — vMedia/agent media builds fail on distroless.
      # The distroless Dockerfile fits file-serving-only facets (api).
      dockerfile: Dockerfile.builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAMMOTH_MODE: all
      MAMMOTH_DATABASE_URL: postgres://mammoth:mammoth@postgres:5432/mammoth?sslmode=disable
      MAMMOTH_HTTP_ADDR: ":8080"
      # Machines fetch answer files / install pools / iPXE trampolines from
      # this address (inst.ks=, casper seedfrom, /netboot/...) — it must be
      # machine-reachable, never loopback.
      MAMMOTH_EXTERNAL_URL: http://${MAMMOTH_HOST_IP:?set MAMMOTH_HOST_IP (BMC-reachable address)}:8080
      # Deployment-provided secrets; never bake into images.
      MAMMOTH_API_TOKEN: ${MAMMOTH_API_TOKEN:?set MAMMOTH_API_TOKEN}
      MAMMOTH_MASTER_KEY: ${MAMMOTH_MASTER_KEY:?set MAMMOTH_MASTER_KEY (base64 32B)}
      MAMMOTH_LOG_FORMAT: json
      # Media dir on a host bind mount: assembled boot ISOs survive container
      # recreation AND the same host dir is what the kernel nfsd exports (the
      # `nfsd` sidecar binds it at /export/media; with a host nfs-server
      # instead, point the base URI at your real /etc/exports path — §4.7).
      # The builder image runs as uid 1000 (mammoth): the host dir must be
      # writable by it (e.g. `mkdir -p data/media && sudo chown 1000 data/media`).
      MAMMOTH_MEDIA_DIR: /media
      MAMMOTH_MEDIA_BASE_URI: nfs://${MAMMOTH_HOST_IP:?set MAMMOTH_HOST_IP (BMC-reachable address)}/export/media
      MAMMOTH_NFS_EXPORT: "false"
      # Huawei iBMC mounts take ~12-15s (ISO9660 metadata validation) and
      # VmmControl Connect fails probabilistically (the driver retries ≤3x) —
      # raise before first use with Huawei machines (§4.7). Default 30s.
      # MAMMOTH_BMC_TIMEOUT: 90s
      MAMMOTH_BMC_TLS_INSECURE: ${MAMMOTH_BMC_TLS_INSECURE:-false}
      # Windows wimboot setup path consumes the SMB export served by the
      # `samba` sidecar (enable with --profile samba); the agent/auto
      # installers don't need it (ops.md §4.5.2). Share name must match the
      # sidecar's MAMMOTH_SMB_SHARE_NAME below.
      MAMMOTH_WINDOWS_INSTALL_SMB_UNC: '\\${MAMMOTH_HOST_IP:?set MAMMOTH_HOST_IP}\mammoth-media'
      # PXE network boot (optional, docs/operations.md §4.5): needs the
      # container ON the provisioning L2 (host or macvlan networking — the
      # bridge port mapping below cannot carry DHCP broadcasts) and
      # CAP_NET_BIND_SERVICE for the privileged UDP ports. Off by default.
      MAMMOTH_PXE_ENABLED: ${MAMMOTH_PXE_ENABLED:-false}
      MAMMOTH_PXE_NEXT_SERVER: ${MAMMOTH_PXE_NEXT_SERVER:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data/media:/media

  # Kernel nfsd managing the HOST kernel's NFS server (privileged container;
  # the nfsd threads and their sockets are kernel-global). Off by default —
  # enable with `docker compose --profile nfs up -d`. Requires a Linux host
  # whose kernel has nfsd support (Docker Desktop VMs don't — use a host
  # nfs-server per §4.7 there) and free host ports 111/2049/20048.
  nfsd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nfsd
    profiles: ["nfs"]
    privileged: true
    network_mode: host
    restart: unless-stopped
    environment:
      MAMMOTH_NFS_EXPORT_DIR: /export/media
      MAMMOTH_NFS_EXPORT_OPTIONS: "*(ro,insecure,no_root_squash,no_subtree_check)"
      MAMMOTH_NFS_MOUNTD_PORT: "20048"
    volumes:
      - ./data/media:/export/media
      # nfsd is a loadable module on most distros — expose the host's modules
      # for the best-effort modprobe (no-op when nfsd is built-in/loaded).
      - /lib/modules:/lib/modules:ro

  # Guest read-only SMB2 export of the media dir for the Windows wimboot
  # setup path (WinPE maps the share in startnet; ops.md §4.5.2). Off by
  # default — enable with `docker compose --profile samba up -d`. The agent
  # apply-image installer does NOT need it (it pulls the install source over
  # the engine's HTTP). Needs host port 445 free (unicast TCP, bridge
  # networking — no host networking required, unlike nfsd).
  samba:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.samba
    profiles: ["samba"]
    restart: unless-stopped
    environment:
      MAMMOTH_SMB_SHARE_NAME: mammoth-media
      MAMMOTH_SMB_EXPORT_DIR: /export/media
    ports:
      - "445:445"
    volumes:
      - ./data/media:/export/media

volumes:
  pgdata:
