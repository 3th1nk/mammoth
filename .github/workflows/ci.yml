name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Contract drift check
        run: |
          go tool oapi-codegen -config api/cfg.yaml api/openapi.yaml
          git diff --exit-code internal/api/gen || {
            echo "::error::generated code out of date with api/openapi.yaml — run 'make generate'"
            exit 1
          }

      - name: Format check
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Unit tests (SQLite queue; no external services)
        run: go test ./... -count=1 -race

      - name: Build binary
        run: go build -o bin/mammoth ./cmd/mammoth

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mammoth
          POSTGRES_PASSWORD: mammoth
          POSTGRES_DB: mammoth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mammoth -d mammoth"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: PG queue contract suite
        run: |
          MAMMOTH_TEST_PG_DSN='postgres://mammoth:mammoth@localhost:5432/mammoth?sslmode=disable' \
            go test ./internal/store/queue/ -run TestPGQueue -count=1 -race

      - name: Acceptance flow (all-in-one, fake BMC)
        run: |
          go build -o bin/mammoth ./cmd/mammoth
          MAMMOTH_DATABASE_URL='postgres://mammoth:mammoth@localhost:5432/mammoth?sslmode=disable' \
          MAMMOTH_API_TOKEN=devtoken \
          MAMMOTH_MASTER_KEY=$(openssl rand -base64 32) \
          MAMMOTH_FAKE_BMC_DELAY=8s \
          MAMMOTH_HEARTBEAT_INTERVAL=1s MAMMOTH_VISIBILITY_TIMEOUT=3s \
          MAMMOTH_HEARTBEAT_TIMEOUT=4s MAMMOTH_REAPER_INTERVAL=1s \
          MAMMOTH_QUEUE_POLL_INTERVAL=100ms \
          bin/mammoth serve --mode=all & server=$!
          sleep 3
          MAMMOTH_FAKE_BMC_DELAY=8s python3 scripts/acceptance.py \
            --api http://localhost:8080 --token devtoken \
            --dsn 'postgres://mammoth:mammoth@localhost:5432/mammoth?sslmode=disable' \
            --binary ./bin/mammoth
          kill $server || true

  container:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build images (amd64+arm64)
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          targets: mammoth mammoth-builder
          push: false
