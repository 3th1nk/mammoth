openapi: 3.1.0
info:
  title: Mammoth API
  version: 0.1.0
  description: |
    Mammoth is a self-contained bare-metal provisioning engine.
    Send in an out-of-band address and a credential, get back a machine that runs.

    Conventions:
    - Errors follow RFC 9457 (`application/problem+json`) with machine-readable `code` and `retryable` extensions.
    - All creating POSTs accept an `Idempotency-Key` header; replays within the window return the original result.
    - List endpoints use cursor pagination (`page_size` + `cursor`, response `next_cursor`).
    - Every response carries `X-Request-Id`; the server contract version is returned in `X-Mammoth-API-Version`.
  license:
    name: Apache-2.0

servers:
  - url: /

security:
  - bearerAuth: []

tags:
  - name: meta
  - name: credentials
  - name: machines
  - name: jobs

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [meta]
      security: []
      summary: Liveness probe (no dependency checks)
      responses:
        '204':
          description: Alive
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'

  /readyz:
    get:
      operationId: readyz
      tags: [meta]
      security: []
      summary: Readiness probe (database and queue reachable)
      responses:
        '204':
          description: Ready
        '503':
          description: Not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1:
    get:
      operationId: getCapabilities
      tags: [meta]
      summary: Capability self-description
      responses:
        '200':
          description: API capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'

  /api/v1/credentials:
    post:
      operationId: createCredential
      tags: [credentials]
      summary: Register a credential
      description: |
        Credentials are write-only: the secret is stored encrypted and never
        returned by any endpoint. The response only carries metadata.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
      responses:
        '201':
          description: Credential created (secret not echoed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/credentialId'
    get:
      operationId: getCredential
      tags: [credentials]
      summary: Get credential metadata (never the secret)
      responses:
        '200':
          description: Credential metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCredential
      tags: [credentials]
      summary: Delete a credential
      responses:
        '204':
          description: Deleted
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/machines:
    post:
      operationId: createMachine
      tags: [machines]
      summary: Register a machine by its out-of-band address and credential
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineCreate'
      responses:
        '201':
          description: Machine registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: listMachines
      tags: [machines]
      summary: List machines
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/order'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/MachineState'
        - name: labels
          in: query
          description: Label equality filters, repeatable (`labels=env=prod&labels=rack=A3`).
          schema:
            type: array
            items:
              type: string
              pattern: '^[^=]+=[^=]*$'
      responses:
        '200':
          description: Machine page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineList'

  /api/v1/machines/{id}:
    parameters:
      - $ref: '#/components/parameters/machineId'
    get:
      operationId: getMachine
      tags: [machines]
      summary: Get a machine
      responses:
        '200':
          description: Machine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMachine
      tags: [machines]
      summary: Update mutable machine fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineUpdate'
      responses:
        '200':
          description: Updated machine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMachine
      tags: [machines]
      summary: Deregister a machine
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/machines/{id}/install-plan:
    parameters:
      - $ref: '#/components/parameters/machineId'
    post:
      operationId: createInstallPlan
      tags: [machines]
      summary: Resolve an install spec into a plan without installing
      description: >
        Read-only dry-run of the install pipeline's resolution stages:
        selectors are resolved against the machine's inventory, the distro
        driver renders its answer files, and the resolved plan is returned.
        Nothing is queued and nothing is written; the validation surface is
        identical to a real install submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallSpec'
      responses:
        '200':
          description: Resolved install plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallPlan'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/machines/{id}/layout:
    parameters:
      - $ref: '#/components/parameters/machineId'
    get:
      operationId: getMachineLayout
      tags: [machines]
      summary: Get the latest disk layout snapshot
      responses:
        '200':
          description: Latest layout snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
        '404':
          description: Machine unknown or no snapshot captured yet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/machines/{id}/bios:
    get:
      operationId: getMachineBios
      tags: [machines]
      summary: Live BIOS attribute table
      description: |
        Reads the controller's BIOS attribute table synchronously (the same
        out-of-band path the actions use; docs/07-bmc.md §6). Values keep
        the vendor's own JSON types and attribute names.
      parameters:
        - $ref: '#/components/parameters/machineId'
      responses:
        '200':
          description: Current attribute table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiosView'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          description: BMC error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/machines/{id}/drives:
    get:
      operationId: getMachineDrives
      tags: [machines]
      summary: Live physical drive table of the controller
      description: |
        Reads the storage controller's physical drives synchronously (the
        same out-of-band path the actions use; docs/07-bmc.md §6.2). Serials
        here are the identity erase_drives consumes — read first, erase
        second.
      parameters:
        - $ref: '#/components/parameters/machineId'
      responses:
        '200':
          description: Current physical drive table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrivesView'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          description: BMC error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/machines/{id}/console:
    parameters:
      - $ref: '#/components/parameters/machineId'
    get:
      operationId: getMachineConsole
      tags: [machines]
      summary: Get a one-time KVM / virtual console URL
      responses:
        '200':
          description: One-time console URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleURL'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: BMC error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/machines/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/machineId'
    post:
      operationId: performMachineAction
      tags: [machines]
      summary: Dispatch a single-machine out-of-band action
      description: |
        Unified entry point for power / boot-device / virtual-media / discover
        actions. Always returns 202 with the created job; there is no
        synchronous BMC call endpoint. Use the job/task endpoints for status.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '202':
          description: Action accepted, job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/jobs:
    post:
      operationId: createJob
      tags: [jobs]
      summary: Submit a job (batch install / power / discover)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/order'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/JobType'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/JobState'
      responses:
        '200':
          description: Job page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'

  /api/v1/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job with its summary
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/jobId'
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job
      description: Stops scheduling and compensates running tasks (e.g. eject media, restore boot order).
      responses:
        '202':
          description: Cancel accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/jobs/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: listJobTasks
      tags: [jobs]
      summary: List tasks of a job
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/cursor'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/TaskState'
      responses:
        '200':
          description: Task page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/jobs/{id}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/jobId'
      - $ref: '#/components/parameters/taskId'
    get:
      operationId: getJobTask
      tags: [jobs]
      summary: Get a task with its stage details
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/jobs/{id}/tasks/{taskId}/logs:
    parameters:
      - $ref: '#/components/parameters/jobId'
      - $ref: '#/components/parameters/taskId'
    get:
      operationId: listJobTaskLogs
      tags: [jobs]
      summary: Task execution logs
      description: |
        Structured log lines emitted while the runner executed this task,
        persisted at write time (docs/02-architecture.md §5.2 log dual-write).
        Complements events — facts and state transitions — with the execution
        trail: what the runner did and observed, stage by stage. Cursor
        paginated over the monotonic log id (docs/03-api.md §1).
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Task log page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLogList'
        '404':
          $ref: '#/components/responses/NotFound'

  /render/{token}/{file}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      - name: file
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: fetchAnswerFile
      tags: [jobs]
      security: []
      summary: Fetch a rendered answer file by task token
      description: |
        Machine-facing endpoint (the installer runs inside the target machine
        and cannot hold a bearer token). The unguessable task token in the
        path is the credential. Fetches are counted in task context.
      responses:
        '200':
          description: Answer file content
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Unknown token or file
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /render/{token}/probe-report:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    post:
      operationId: reportProbeFindings
      tags: [jobs]
      security: []
      summary: Submit ramdisk probe findings
      description: |
        Machine-facing endpoint for the ramdisk probe (docs/05-inventory.md
        §4): the probe environment scans /sys and POSTs the layout content
        here. The unguessable task token in the path is the credential; the
        body is persisted verbatim as a layout snapshot (source=ramdisk).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeReport'
      responses:
        '204':
          description: Recorded
        '404':
          description: Unknown token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /render/{token}/complete:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    post:
      operationId: reportInstallComplete
      tags: [jobs]
      security: []
      summary: Report install completion from the target machine
      description: |
        Called by the %post hook with the task token; unblocks the install
        stage. A non-zero exit report marks the install failed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, failed]
                detail:
                  type: string
      responses:
        '204':
          description: Recorded
        '404':
          $ref: '#/components/responses/NotFound'

  /netboot/script:
    get:
      operationId: getNetbootScript
      tags: [netboot]
      security: []
      summary: iPXE boot script for a client MAC
      description: |
        Machine-facing endpoint (docs/06-install-pipeline.md §3.3): iPXE
        fetches its boot script here after chaining from the NBP. The MAC is
        only a routing key — the script content is what the runner armed for
        that machine, and unknown MACs get a script that exits back to the
        firmware boot order (no address assignment ever happens; the site
        DHCP owns that). Public by contract (security: []).
      parameters:
        - name: mac
          in: query
          required: true
          schema:
            type: string
            pattern: '^([0-9A-Fa-f]{2}[:.-]?){5}[0-9A-Fa-f]{2}$'
        - name: arch
          in: query
          required: false
          description: Firmware architecture the client booted with (from DHCP
            option 93); informational.
          schema:
            type: string
            enum: [bios, ia32, uefi-x64, uefi-arm64]
      responses:
        '200':
          description: |
            The iPXE script for a pending boot entry, or a fallback script
            that exits when no entry is pending (200 on purpose: a 404 would
            strand iPXE in its shell instead of falling through to disk).
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Unprocessable'

  /netboot/files/{token}/{file}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      - name: file
        in: path
        required: true
        description: >-
          Bare file name registered in the boot entry (kernel, initrd,
          modloop); no path separators — traversal is structurally impossible
          and non-registered names 404.
        schema:
          type: string
          maxLength: 128
    get:
      operationId: fetchNetbootFile
      tags: [netboot]
      security: []
      summary: Fetch a network boot tree file by task token
      description: |
        Machine-facing endpoint for the PXE boot path: serves the per-task
        boot tree (kernel/initrd/aux files extracted from the distro media)
        that the iPXE script references. The unguessable task token in the
        path is the credential, mirroring /render/{token}/{file}.
      responses:
        '200':
          description: Boot artifact content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown token or file not in the entry's allowlist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /netboot/enroll/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      - name: mac
        in: query
        required: true
        description: >-
          MAC of the NIC the client booted from (the enrollment script passes
          it to the probe via kernel args); the report is keyed by it.
        schema:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:.-]?){5}[0-9A-Fa-f]{2}$'
    post:
      operationId: reportEnrollment
      tags: [netboot]
      security: []
      summary: Submit zero-registration enrollment findings
      description: |
        Machine-facing endpoint for the enrollment probe (docs/09-roadmap.md,
        zero-registration entry): an unknown MAC was offered the shared
        enrollment payload, scanned /sys and reports here. The configured
        enrollment token in the path is the credential (a mismatching token
        is indistinguishable from an unknown one); the report lands in
        pending_machines keyed by the query MAC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeReport'
      responses:
        '204':
          description: Recorded
        '404':
          description: Unknown enrollment token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /netboot/enroll-file/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: >-
          Bare file name of the shared enrollment boot tree (kernel,
          initramfs, apkovl overlay, modloop); no path separators.
        schema:
          type: string
          maxLength: 128
    get:
      operationId: fetchNetbootEnrollFile
      tags: [netboot]
      security: []
      summary: Fetch a shared enrollment boot tree file
      description: |
        Machine-facing endpoint serving the shared enrollment payload (docs/
        09-roadmap.md, zero-registration entry): one boot tree for every
        unknown MAC, built once at startup when MAMMOTH_PXE_ENROLL is on.
        The tree carries the enrollment token in its overlay — the same
        provisioning-L2 trust model as the per-task boot trees. 404 when
        enrollment is disabled or the name is not in the fixed allowlist.
      responses:
        '200':
          description: Boot artifact content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Enrollment disabled or unknown file
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/pending-machines:
    get:
      operationId: listPendingMachines
      tags: [machines]
      summary: List zero-registration PXE sightings
      description: |
        Machines that announced themselves over PXE but are not registered
        yet (docs/09-roadmap.md, zero-registration entry): firmware
        observations arrive from the PXE responder (DHCP option 93), the
        hardware report from the enrollment probe when it has booted.
        Promotion to a registered machine (claim) is a follow-up operation.
      responses:
        '200':
          description: Sightings ordered by first sight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingMachineList'

  /api/v1/pending-machines/{mac}:
    parameters:
      - name: mac
        in: path
        required: true
        schema:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:.-]?){5}[0-9A-Fa-f]{2}$'
    get:
      operationId: getPendingMachine
      tags: [machines]
      summary: One zero-registration sighting by MAC
      responses:
        '200':
          description: The sighting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingMachine'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pending-machines/{mac}/claim:
    parameters:
      - name: mac
        in: path
        required: true
        schema:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:.-]?){5}[0-9A-Fa-f]{2}$'
    post:
      operationId: claimPendingMachine
      tags: [machines]
      summary: Promote a zero-registration sighting to a registered machine
      description: |
        Claims a pending sighting (docs/09-roadmap.md, zero-registration
        entry). Creates the machine exactly as POST /machines would, then
        migrates the pending data so nothing gathered by itself is lost: the
        firmware observation into the machine's PXE observation columns and
        the enrollment probe's /sys scan into its first layout snapshot
        (source=ramdisk), and finally removes the pending row. The request
        body is the human's side of the bargain — the sighting tells you
        WHICH machine this is, the claim tells mammoth how to REACH it.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineCreate'
      responses:
        '201':
          description: Machine registered (the claimed sighting is consumed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/jobs/{id}/events:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: streamJobEvents
      tags: [jobs]
      summary: Stream a job's events (SSE)
      description: |
        Server-sent events for a job: stage/state changes and machine facts.
        Watermark by event id; reconnects resume from the Last-Event-ID
        header. Bearer auth applies (integrators stream with a token).
      parameters:
        - name: Last-Event-ID
          in: header
          description: Resume the stream after this event id.
          schema:
            type: string
      responses:
        '200':
          description: SSE stream (`text/event-stream`).
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks:
    post:
      operationId: createWebhook
      tags: [jobs]
      summary: Subscribe an HTTP endpoint to events
      description: |
        Events are delivered with an HMAC-SHA256 signature header
        (`X-Mammoth-Signature: sha256=<hex>` over the raw body). The signing
        secret is write-only: server-generated when omitted and returned
        exactly once in the creation response.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '201':
          description: Subscription created; secret is shown only here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreated'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      operationId: listWebhooks
      tags: [jobs]
      summary: List webhook subscriptions (no secrets)
      responses:
        '200':
          description: Subscription page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'

  /api/v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWebhook
      tags: [jobs]
      summary: Get a webhook subscription (no secret)
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWebhook
      tags: [jobs]
      summary: Delete a webhook subscription
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/events:
    get:
      operationId: listEvents
      tags: [jobs]
      summary: Query events (audit and SSE backlog)
      description: |
        Cursor-paginated event listing. Audit queries filter by
        resource/type; the SSE global stream is the same surface streamed
        via `streamEvents`.
      parameters:
        - name: resource_type
          in: query
          schema:
            type: string
            enum: [job, task, machine, credential]
        - name: resource_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          description: Exact event type filter (e.g. machine.discovered).
          schema:
            type: string
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'

  /api/v1/events/stream:
    get:
      operationId: streamEvents
      tags: [jobs]
      summary: Stream all events (SSE)
      parameters:
        - name: resource
          in: query
          description: Filter to one resource id (e.g. job_x9k2).
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        '200':
          description: SSE stream (`text/event-stream`).
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Event'

  /api/v1/jobs/{id}/tasks/{taskId}/retry:
    parameters:
      - $ref: '#/components/parameters/jobId'
      - $ref: '#/components/parameters/taskId'
    post:
      operationId: retryJobTask
      tags: [jobs]
      summary: Retry a failed or interrupted task
      description: Re-enqueues the task from its last stage index. Only failed/interrupted tasks can be retried.
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Static API token managed by the deployment (first version); an external IdP adapter point is reserved.

  headers:
    XRequestId:
      description: Server-generated request identifier, echoed in logs and errors.
      schema:
        type: string
    XApiVersion:
      description: Server contract version.
      schema:
        type: string

  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: Replay safety for creating POSTs; within the window a replay returns the original result.
      schema:
        type: string
        maxLength: 255
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    cursor:
      name: cursor
      in: query
      description: Opaque continuation token from a previous page (`next_cursor`).
      schema:
        type: string
    orderBy:
      name: order_by
      in: query
      schema:
        type: string
        enum: [created_at, updated_at]
        default: created_at
    order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    credentialId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CredentialId'
    machineId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MachineId'
    jobId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobId'
    taskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TaskId'

  responses:
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict with current state (duplicate, invalid transition, …)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Semantic validation failure (schema valid, constraints violated)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ── identifiers ────────────────────────────────────────────────────────
    CredentialId:
      type: string
      pattern: '^cred_[0-9a-z]+$'
    MachineId:
      type: string
      pattern: '^mch_[0-9a-z]+$'
    JobId:
      type: string
      pattern: '^job_[0-9a-z]+$'
    TaskId:
      type: string
      pattern: '^tsk_[0-9a-z]+$'

    # ── meta ───────────────────────────────────────────────────────────────
    Capabilities:
      type: object
      required: [version, resources]
      properties:
        version:
          type: string
          description: Contract version served by this instance.
        bios_set_confirm:
          type: string
          description: The set_bios_attributes confirmation policy
            (docs/07-bmc.md §6) — required rejects submissions without the
            explicit confirm flag; optional keeps only the runner-side
            live-table validation.
          enum: [required, optional]
        drive_erase_confirm:
          type: string
          description: The erase_drives confirmation policy (docs/07-bmc.md
            §6.2) — same two-stage shape as bios_set_confirm, for the most
            destructive action in the contract.
          enum: [required, optional]
        resources:
          type: array
          items:
            type: string
        distros:
          type: array
          description: Distro drivers registered on this instance with their
            keep-partition support level (docs/06-install-pipeline.md §5).
          items:
            $ref: '#/components/schemas/DistroSupport'
        boot_strategy_default:
          type: string
          description: Boot carrier strategy used when a job spec does not
            name one (docs/06-install-pipeline.md §3).
          enum: [virtual_media, pxe]
        netboot_enabled:
          type: boolean
          description: Whether the netboot service (proxyDHCP/TFTP/iPXE) runs
            on this instance; pxe boot requests require it.
        windows_smb_share:
          type: boolean
          description: Whether the deployment SMB export for the windows wimboot
            carrier is configured (MAMMOTH_WINDOWS_INSTALL_SMB_UNC); windows pxe
            boot requests require it.
        windows_agent_installer:
          type: boolean
          description: Whether the windows agent apply-image pathway
            (boot.installer=agent) is usable on this deployment — PXE on
            plus the alpine extended ISO pool configured
            (MAMMOTH_WINDOWS_APPLY_ALPINE_ISO).

    DistroSupport:
      type: object
      required: [name, keep_partition_support]
      properties:
        name:
          type: string
        keep_partition_support:
          type: string
          enum: [full, partial, none]
        pxe_support:
          type: string
          description: Network boot (PXE/iPXE) support level for install
            submissions with boot.strategy=pxe (docs/06-install-pipeline.md §6).
          enum: [full, partial, none]
        family:
          type: string
          description: Installer family riding this distro
            (docs/06-install-pipeline.md §5) — which answer-file dialect or
            agent path renders the spec. Absent for third-party drivers
            without the capability.
          enum: [kickstart, autoinstall, preseed, agent]

    Problem:
      type: object
      description: RFC 9457 problem details with Mammoth extensions.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Machine-readable error code (`<DOMAIN>_<PHENOMENON>`).
          example: BMC_UNREACHABLE
        retryable:
          type: boolean
          description: Whether the same request may succeed on retry.

    ErrorInfo:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC.

    # ── credentials ────────────────────────────────────────────────────────
    CredentialType:
      type: string
      enum: [bmc, ssh]

    CredentialSecret:
      type: object
      description: >-
        Secret payload, stored encrypted; never returned by the API. BMC
        credentials use username+password; SSH credentials take username and
        either a private_key (PEM; recommended — provisioned systems commonly
        refuse root password SSH) or a password.
      required: [username]
      properties:
        username:
          type: string
        password:
          type: string
        private_key:
          type: string
          description: PEM-encoded SSH private key for public-key auth (ssh credentials).

    CredentialCreate:
      type: object
      required: [type, name, secret]
      properties:
        type:
          $ref: '#/components/schemas/CredentialType'
        name:
          type: string
          maxLength: 255
        secret:
          $ref: '#/components/schemas/CredentialSecret'

    Credential:
      type: object
      required: [id, type, name, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/CredentialId'
        type:
          $ref: '#/components/schemas/CredentialType'
        name:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    # ── machines ───────────────────────────────────────────────────────────
    BMCProtocol:
      type: string
      enum: [redfish, ipmi, auto, fake]
      description: |
        `auto` probes Redfish first and falls back to IPMI.
        `fake` selects the in-process simulator for development and testing.
    BootDevice:
      type: string
      enum: [pxe, disk, cdrom, bios]
    PowerState:
      type: string
      enum: [on, off, unknown]
    MachineState:
      type: string
      enum: [registering, discovering, ready, error]

    BMC:
      type: object
      required: [address, credential_id]
      properties:
        address:
          type: string
          description: Out-of-band management address (host or host:port).
        protocol:
          $ref: '#/components/schemas/BMCProtocol'
        credential_id:
          $ref: '#/components/schemas/CredentialId'
        vendor:
          type: string
          nullable: true
          description: Discovered values, filled by inventory probes.
        model:
          type: string
          nullable: true
        firmware_version:
          type: string
          nullable: true

    CPU:
      type: object
      properties:
        model:
          type: string
        cores:
          type: integer

    Disk:
      type: object
      required: [name]
      properties:
        name:
          type: string
        serial:
          type: string
        size_bytes:
          type: integer
          format: int64
        medium:
          type: string
          enum: [ssd, hdd, unknown]
        protocol:
          type: string
          description: e.g. nvme, sas, sata.
        removable:
          type: boolean

    NIC:
      type: object
      required: [name]
      properties:
        name:
          type: string
        mac:
          type: string
        speed_mbps:
          type: integer
        link_up:
          type: boolean
        pci_address:
          type: string

    HardwareView:
      type: object
      description: Hardware inventory as reported by probes; null until first discovery.
      required: [coverage]
      properties:
        serial_number:
          type: string
        cpu:
          $ref: '#/components/schemas/CPU'
        memory_bytes:
          type: integer
          format: int64
        disks:
          type: array
          items:
            $ref: '#/components/schemas/Disk'
        nics:
          type: array
          items:
            $ref: '#/components/schemas/NIC'
        coverage:
          type: string
          enum: [full, partial]
          description: |
            `full` — the probe collected the complete spec-level view.
            `partial` — a known blind spot applies (vendor matrix hit, RAID
            volumes not enumerable, storage resources missing); see coverage_notes.
        coverage_notes:
          type: array
          description: Why coverage is partial (machine-readable reasons).
          items:
            type: string

    MachineSSH:
      type: object
      properties:
        address:
          type: string
          description: The machine's own (in-band) address, used by the inband_ssh probe.

    FirmwareInventory:
      type: array
      items:
        $ref: '#/components/schemas/FirmwareComponent'

    FirmwareComponent:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The controller's own stable identity for the component.
        name:
          type: string
        version:
          type: string
          description: Informational; empty on vendors reporting presence without a version.

    MachineCreate:
      type: object
      required: [bmc]
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        bmc:
          $ref: '#/components/schemas/BMC'
        ssh_credential_id:
          allOf:
            - $ref: '#/components/schemas/CredentialId'
          description: Credential for in-band (SSH) probes; optional.
        ssh:
          $ref: '#/components/schemas/MachineSSH'
          description: In-band addressing; required for partition-level discovery.

    MachineUpdate:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        bmc:
          type: object
          properties:
            address:
              type: string
            protocol:
              $ref: '#/components/schemas/BMCProtocol'
            credential_id:
              $ref: '#/components/schemas/CredentialId'
        ssh_credential_id:
          type: string
          nullable: true
        ssh:
          $ref: '#/components/schemas/MachineSSH'

    Machine:
      type: object
      required: [id, bmc, power_state, state, labels, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/MachineId'
        labels:
          type: object
          additionalProperties:
            type: string
        bmc:
          $ref: '#/components/schemas/BMC'
        ssh_credential_id:
          type: string
          nullable: true
        ssh:
          allOf:
            - $ref: '#/components/schemas/MachineSSH'
          nullable: true
        hardware:
          $ref: '#/components/schemas/HardwareView'
        firmware:
          description: |
            Controller firmware inventory (docs/07-bmc.md §6), collected with
            the spec view by discovery. Null until a discovery with the
            pure-read capability (Redfish SoftwareInventory) succeeds; the
            ipmi protocol reports none.
          allOf:
            - $ref: '#/components/schemas/FirmwareInventory'
          nullable: true
        power_state:
          $ref: '#/components/schemas/PowerState'
        state:
          $ref: '#/components/schemas/MachineState'
        last_error:
          allOf:
            - $ref: '#/components/schemas/ErrorInfo'
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    MachineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Machine'
        next_cursor:
          type: string
          nullable: true

    # ── pending machines (zero-registration sightings) ────────────────────
    PendingMachine:
      type: object
      description: |
        A machine that announced itself over PXE but is not registered yet
        (docs/09-roadmap.md, zero-registration entry). firmware comes from
        the PXE responder (DHCP option 93); report from the enrollment
        probe's /sys scan when it has booted. Not a machine resource —
        promotion (claim) is a follow-up operation.
      required: [mac, first_seen_at, last_seen_at]
      properties:
        mac:
          type: string
          description: Normalized lowercase colon form of the booting NIC.
        firmware:
          type: string
          nullable: true
          description: Firmware architecture last announced (option 93 label).
        report:
          type: object
          nullable: true
          additionalProperties: true
          description: The enrollment probe's /sys scan, persisted verbatim.
        first_seen_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'

    PendingMachineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingMachine'

    # ── layout snapshot ────────────────────────────────────────────────────
    Layout:
      type: object
      required: [captured_at, source, disks]
      properties:
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        source:
          type: string
          enum: [inband_ssh, ramdisk]
        disks:
          type: array
          items:
            type: object
            required: [device, table, partitions]
            properties:
              device:
                type: string
              match:
                type: object
                properties:
                  serial:
                    type: string
              table:
                type: string
                enum: [gpt, mbr]
              partitions:
                type: array
                items:
                  type: object
                  required: [number]
                  properties:
                    number:
                      type: integer
                    start_bytes:
                      type: integer
                      format: int64
                    end_bytes:
                      type: integer
                      format: int64
                    size_bytes:
                      type: integer
                      format: int64
                    fstype:
                      type: string
                    label:
                      type: string
                    mountpoint:
                      type: string
                    uuid:
                      type: string

    ConsoleURL:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: One-time virtual console URL.

    # ── actions ────────────────────────────────────────────────────────────
    ProbeKind:
      type: string
      enum: [auto, redfish, inband_ssh, ramdisk]
      description: |
        ramdisk is optional (docs/05-inventory.md §4) and requires the
        alpine carrier (MAMMOTH_PROBE_ALPINE_ISO) with MAMMOTH_RAMDISK_ENABLED.

    BiosView:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          additionalProperties: true
          description: The controller's attribute table (vendor keys, vendor JSON value types).

    DrivesView:
      type: object
      required: [drives]
      properties:
        drives:
          type: array
          items:
            $ref: '#/components/schemas/DriveEntry'

    DriveEntry:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The controller's presentation name for the drive.
        serial:
          type: string
          description: The identity erase_drives consumes.
        size_bytes:
          type: integer
          format: int64
        medium:
          type: string
          description: ssd | hdd | unknown.
        protocol:
          type: string

    ActionEraseDrives:
      type: object
      description: |
        Issue the controller's secure erase on physical drives — NIST 800-88
        media sanitization at the controller level (docs/07-bmc.md §6.2).
        THE MOST DESTRUCTIVE ACTION IN THE CONTRACT: data is unrecoverable
        by design. Two-stage confirmation applies — the explicit confirm
        flag unless the deployment sets MAMMOTH_ERASE_CONFIRM=optional, and
        the runner re-reads the live drive table, rejecting any serial not
        on it before touching anything. Declare exactly one of serials or
        all.
      required: [type]
      properties:
        type:
          type: string
          enum: [erase_drives]
        serials:
          type: array
          items:
            type: string
          description: Physical drive serials per the controller's live table (GET /machines/{id}/drives).
          minItems: 1
        all:
          type: boolean
          description: Erase every physical drive the controller reports; resolved against the live table at execution.
        confirm:
          type: boolean
          default: false
          description: Explicit high-risk confirmation; required by the default policy.

    ActionSetBiosAttributes:
      type: object
      description: |
        Write pending BIOS attribute values (docs/07-bmc.md §6). HIGH-RISK:
        the two-stage contract requires the explicit confirm flag unless the
        deployment sets MAMMOTH_BIOS_CONFIRM=optional; the runner re-reads
        the live attribute table and rejects unknown names. Values are
        pending — the BMC applies them at the next boot.
      required: [type, attributes]
      properties:
        type:
          type: string
          enum: [set_bios_attributes]
        attributes:
          type: object
          description: Attribute names per the controller's own registry; values keep the vendor's JSON types.
          additionalProperties: true
          minProperties: 1
        confirm:
          type: boolean
          default: false
          description: Explicit high-risk confirmation; required by the default policy.

    ActionRequest:
      oneOf:
        - $ref: '#/components/schemas/ActionDiscover'
        - $ref: '#/components/schemas/ActionPowerOn'
        - $ref: '#/components/schemas/ActionPowerOff'
        - $ref: '#/components/schemas/ActionSoftOff'
        - $ref: '#/components/schemas/ActionReboot'
        - $ref: '#/components/schemas/ActionHardReboot'
        - $ref: '#/components/schemas/ActionCycle'
        - $ref: '#/components/schemas/ActionSetBootDevice'
        - $ref: '#/components/schemas/ActionMountMedia'
        - $ref: '#/components/schemas/ActionEjectMedia'
        - $ref: '#/components/schemas/ActionSetBiosAttributes'
        - $ref: '#/components/schemas/ActionEraseDrives'
      discriminator:
        propertyName: type
        mapping:
          discover: '#/components/schemas/ActionDiscover'
          power_on: '#/components/schemas/ActionPowerOn'
          power_off: '#/components/schemas/ActionPowerOff'
          soft_off: '#/components/schemas/ActionSoftOff'
          reboot: '#/components/schemas/ActionReboot'
          hard_reboot: '#/components/schemas/ActionHardReboot'
          cycle: '#/components/schemas/ActionCycle'
          set_boot_device: '#/components/schemas/ActionSetBootDevice'
          mount_media: '#/components/schemas/ActionMountMedia'
          eject_media: '#/components/schemas/ActionEjectMedia'
          set_bios_attributes: '#/components/schemas/ActionSetBiosAttributes'
          erase_drives: '#/components/schemas/ActionEraseDrives'

    ActionDiscover:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [discover]
        probe:
          $ref: '#/components/schemas/ProbeKind'
        boot:
          $ref: '#/components/schemas/BootSpec'

    ActionPowerOn:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [power_on]
    ActionPowerOff:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [power_off]
    ActionSoftOff:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [soft_off]
    ActionReboot:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [reboot]
    ActionHardReboot:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [hard_reboot]
    ActionCycle:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [cycle]

    ActionSetBootDevice:
      type: object
      required: [type, device]
      properties:
        type:
          type: string
          enum: [set_boot_device]
        device:
          $ref: '#/components/schemas/BootDevice'
        once:
          type: boolean
          default: true

    ActionEjectMedia:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [eject_media]
      description: Eject virtual media from all slots that carry it.

    ActionMountMedia:
      type: object
      required: [type, image_url]
      properties:
        type:
          type: string
          enum: [mount_media]
        image_url:
          type: string
          format: uri
        eject_after:
          type: boolean
          default: false

    # ── install spec (04 §5) ───────────────────────────────────────────────
    DiskSelectorMatch:
      type: object
      description: Selector fields are combinable (e.g. type=nvme + size=largest).
      properties:
        serial:
          type: string
          description: Exact serial number match.
        type:
          type: string
          enum: [ssd, hdd, nvme]
        size:
          type: string
          enum: [largest, smallest]
        protocol:
          type: string
        removable:
          type: boolean

    SizeSpec:
      type: string
      description: Byte size string (`512M`, `100G`) or `rest` (at most one per disk, enforced at validation).
      pattern: '^(\d+(\.\d+)?[KMGT]?)$|^rest$'

    PartitionSpec:
      type: object
      required: [size, fs]
      properties:
        size:
          $ref: '#/components/schemas/SizeSpec'
        fs:
          type: string
          enum: [vfat, xfs, ext4, swap, ntfs, fat32]
          description: ntfs/fat32 belong to the windows2019 dialect
            (docs/compat/distros.md §windows); the Linux dialects reject
            them at render time.
        mount:
          type: string
        flags:
          type: array
          items:
            type: string
            example: esp

    PreserveSpec:
      type: object
      required: [number]
      properties:
        number:
          type: integer
          description: Partition number that must exist in the machine's layout snapshot.
        mount:
          type: string
        fs:
          type: string
          enum: [vfat, xfs, ext4, swap]

    DiskSpec:
      type: object
      required: [select]
      properties:
        select:
          type: object
          required: [match]
          properties:
            match:
              $ref: '#/components/schemas/DiskSelectorMatch'
        wipe:
          type: boolean
        keep:
          type: string
          enum: [disk, partitions]
        preserve:
          type: array
          items:
            $ref: '#/components/schemas/PreserveSpec'
        partitions:
          type: array
          items:
            $ref: '#/components/schemas/PartitionSpec'

    RaidLevel:
      type: string
      enum: ["0", "1", "5", "10"]

    RaidMode:
      type: string
      enum: [software, hardware]
      default: software
      description: |
        `software` builds mdadm arrays at install time (kickstart raid lines).
        `hardware` creates Redfish Volumes on the storage controller in the
        configure_raid stage; the resulting logical drive is re-inventoried
        and its partitions bind to the discovered device.

    RaidSpec:
      type: object
      required: [name, level, mode, members]
      properties:
        name:
          type: string
          description: Logical device name (md0 for software; volume label for hardware).
        level:
          $ref: '#/components/schemas/RaidLevel'
        mode:
          $ref: '#/components/schemas/RaidMode'
        members:
          type: array
          minItems: 2
          items:
            type: object
            required: [match]
            properties:
              match:
                $ref: '#/components/schemas/DiskSelectorMatch'
        partitions:
          type: array
          description: Partitions on the logical device (software mode renders
            raid lines; hardware mode binds to the discovered drive).
          items:
            $ref: '#/components/schemas/PartitionSpec'

    StorageSpec:
      type: object
      required: [disks]
      properties:
        disks:
          type: array
          items:
            $ref: '#/components/schemas/DiskSpec'
        raid:
          type: array
          description: |
            Declarative RAID volumes. Members are consumed disks resolved by
            selector (implicitly wiped); they must not overlap with disks[]
            entries. Level/member-count rules: 0→2+, 1→2+, 5→3+, 10→4+.
          items:
            $ref: '#/components/schemas/RaidSpec'
        root_device_hints:
          type: object
          properties:
            min_size_gb:
              type: integer
        alignment:
          type: string
          enum: [4k, 512e]
          default: 4k

    Route:
      type: object
      required: [to, via]
      properties:
        to:
          type: string
          description: Destination prefix or `default`.
        via:
          type: string

    Nameservers:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: string
        search:
          type: array
          items:
            type: string

    InterfaceMatch:
      type: object
      description: Selection stability order is mac > pci_address > name.
      properties:
        mac:
          type: string
        pci_address:
          type: string
        name:
          type: string

    NetworkInterface:
      type: object
      description: cloud-init network-config v2 shaped. Mammoth never allocates addresses; all `addresses` are caller-provided.
      properties:
        match:
          $ref: '#/components/schemas/InterfaceMatch'
        set_name:
          type: string
        addresses:
          type: array
          items:
            type: string
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        nameservers:
          $ref: '#/components/schemas/Nameservers'
        mtu:
          type: integer
        bond:
          type: object
          required: [interfaces, mode]
          properties:
            interfaces:
              type: array
              items:
                type: object
                required: [match]
                properties:
                  match:
                    $ref: '#/components/schemas/InterfaceMatch'
                  set_name:
                    type: string
            mode:
              type: string
              description: e.g. active-backup, 802.3ad, balance-tlb.
            params:
              type: object
              additionalProperties: true
        vlan:
          type: object
          required: [id, link]
          properties:
            id:
              type: integer
            link:
              type: string

    AccessSpec:
      type: object
      properties:
        root_password:
          type: string
          description: >-
            Absent or empty → per-task random password (default; delivered
            once via the task.root_password event). Any non-empty value is
            used as the literal root password.
        ssh_keys:
          type: array
          items:
            type: string
        capabilities:
          type: array
          description: >-
            Access capabilities enabled on the installed system (windows:
            "rdp" | "winrm" | "ping"; default empty = none enabled). Opt-in
            per task — turning on inbound management of a fresh install is
            the operator's security call. Unknown values are rejected at
            render.
          items:
            type: string
            enum: [rdp, winrm, ping]

    IdentitySpec:
      type: object
      properties:
        hostname_pattern:
          type: string
          example: node-{index}

    ScriptSpec:
      type: object
      required: [stage]
      properties:
        stage:
          type: string
          enum: [pre_install, post_install]
        content_base64:
          type: string
          description: Script body, base64 encoded. Mutually exclusive with `url`.
        url:
          type: string
          format: uri
        expected_exit_codes:
          type: array
          items:
            type: integer

    InstallPlan:
      type: object
      required: [driver, resolved_disks, boot_drive]
      properties:
        driver:
          type: string
          description: Distro driver the plan was rendered with.
        resolved_disks:
          type: array
          items:
            $ref: '#/components/schemas/InstallPlanDisk'
        boot_drive:
          type: string
          description: Device holding the root partition (bootloader target).
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal observations (out-of-band view only, unused spec keys, …).

    InstallPlanDisk:
      type: object
      required: [device, size_bytes, planned_partitions]
      properties:
        device:
          type: string
          description: Kernel device name the selector resolved to.
        matched_by:
          type: object
          additionalProperties: true
          description: The selector fields that produced this match.
        serial:
          type: string
        size_bytes:
          type: integer
          format: int64
        keep:
          type: boolean
          description: True when the disk is claimed with keep (never touched).
        planned_partitions:
          type: array
          items:
            $ref: '#/components/schemas/InstallPlanPartition'

    InstallPlanPartition:
      type: object
      required: [number, mount, fs]
      properties:
        number:
          type: integer
          description: Partition number in declaration order.
        mount:
          type: string
        fs:
          type: string
        size_mb:
          type: integer
          description: Fixed size in MB; absent when grow.
        grow:
          type: boolean
        flags:
          type: array
          items:
            type: string

    InstallSpec:
      type: object
      required: [image]
      properties:
        image:
          type: object
          required: [distro]
          properties:
            source:
              type: string
              format: uri
              description: Installer image URL (file, http(s) or nfs URI reachable
                from the engine host). Required.
            checksum:
              type: string
              description: e.g. `sha256:9f86d0...`.
            distro:
              type: string
              description: Explicitly declared (no implicit detection), e.g. rocky9.
        storage:
          $ref: '#/components/schemas/StorageSpec'
        network:
          type: array
          items:
            $ref: '#/components/schemas/NetworkInterface'
        identity:
          $ref: '#/components/schemas/IdentitySpec'
        access:
          $ref: '#/components/schemas/AccessSpec'
        scripts:
          type: array
          items:
            $ref: '#/components/schemas/ScriptSpec'
        boot:
          $ref: '#/components/schemas/BootSpec'

    BootSpec:
      type: object
      description: Boot carrier strategy (docs/06-install-pipeline.md §3).
        Absent → the server default (capabilities.boot_strategy_default).
      properties:
        strategy:
          type: string
          enum: [virtual_media, pxe]
          default: virtual_media
          description: |
            virtual_media: the builder repacks the distro ISO into a
            per-task boot ISO the BMC mounts. pxe: the machine boots the
            installer over the LAN (proxyDHCP + iPXE); requires the netboot
            service enabled and a distro declaring pxe_support.
        installer:
          type: string
          enum: [setup, agent]
          default: setup
          description: |
            Windows-only install pathway. setup: the setup.exe flow through
            the wimboot carrier (the default; needs the deployment SMB
            export). agent: the agent apply-image pathway — the machine
            boots the alpine agent, which wimlib-applies install.wim onto
            the declarative NTFS volume and pre-bakes the BCD; PXE-only,
            needs no SMB export, and requires the alpine extended ISO pool
            (MAMMOTH_WINDOWS_APPLY_ALPINE_ISO). Other distros reject it.

    Policy:
      type: object
      properties:
        concurrency:
          type: integer
          minimum: 1
          default: 10
        on_task_failure:
          type: string
          enum: [continue, abort_batch]
          default: continue
        verify_layout:
          type: boolean
          default: true
        task_timeout_seconds:
          type: integer
          minimum: 1
          default: 3600

    # ── jobs & tasks ───────────────────────────────────────────────────────
    JobType:
      type: string
      enum: [install, power, discover]
    JobState:
      type: string
      enum: [pending, running, succeeded, partial, failed, canceled]
    TaskState:
      type: string
      enum: [pending, running, succeeded, failed, canceled, interrupted]
    StageState:
      type: string
      enum: [pending, running, succeeded, failed, skipped, canceled]

    JobSummary:
      type: object
      required: [total]
      properties:
        total:
          type: integer
        pending:
          type: integer
        running:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        interrupted:
          type: integer
        canceled:
          type: integer

    JobTargets:
      type: object
      required: [machine_ids]
      properties:
        machine_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MachineId'
        overrides:
          type: object
          description: Per-machine Install Spec fragments, shallow-merged over `spec`.
          additionalProperties:
            $ref: '#/components/schemas/InstallSpec'

    JobCreate:
      type: object
      required: [type, targets]
      properties:
        type:
          $ref: '#/components/schemas/JobType'
        targets:
          $ref: '#/components/schemas/JobTargets'
        spec:
          $ref: '#/components/schemas/InstallSpec'
        action:
          $ref: '#/components/schemas/ActionRequest'
          description: "Required for `power` jobs (the BMC action to run on each target); optional for `discover` (defaults to `probe: auto`); ignored for `install`."
        policy:
          $ref: '#/components/schemas/Policy'

    Job:
      type: object
      required: [id, type, state, summary, created_at]
      properties:
        id:
          $ref: '#/components/schemas/JobId'
        type:
          $ref: '#/components/schemas/JobType'
        state:
          $ref: '#/components/schemas/JobState'
        summary:
          $ref: '#/components/schemas/JobSummary'
        machine_ids:
          type: array
          items:
            $ref: '#/components/schemas/MachineId'
        spec:
          allOf:
            - $ref: '#/components/schemas/InstallSpec'
          nullable: true
          description: Resolved final spec (template/override merge applied), for audit; install jobs only.
        action:
          $ref: '#/components/schemas/ActionRequest'
        policy:
          $ref: '#/components/schemas/Policy'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type: string
          nullable: true

    Stage:
      type: object
      required: [name, state]
      properties:
        name:
          type: string
        state:
          $ref: '#/components/schemas/StageState'
        attempt:
          type: integer
        started_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        finished_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        duration_ms:
          type: integer
          nullable: true

    Task:
      type: object
      required: [id, job_id, machine_id, state, attempt, stages, created_at]
      properties:
        id:
          $ref: '#/components/schemas/TaskId'
        job_id:
          $ref: '#/components/schemas/JobId'
        machine_id:
          $ref: '#/components/schemas/MachineId'
        state:
          $ref: '#/components/schemas/TaskState'
        attempt:
          type: integer
        flow_name:
          type: string
        answer_url:
          type: string
          nullable: true
          description: |
            Machine-facing URL of the rendered answer file (install flows).
            Exposed for audit and debugging; the task token in the path is
            the machine credential (docs/06-install-pipeline.md §2.2).
        stages:
          type: array
          items:
            $ref: '#/components/schemas/Stage'
        error:
          allOf:
            - $ref: '#/components/schemas/ErrorInfo'
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor:
          type: string
          nullable: true

    Event:
      type: object
      required: [id, resource_type, resource_id, type, ts]
      properties:
        id:
          type: integer
          format: int64
          description: Monotonic watermark (SSE Last-Event-ID).
        resource_type:
          type: string
        resource_id:
          type: string
        type:
          type: string
          example: task.stage_changed
        payload:
          additionalProperties: true
          nullable: true
        ts:
          $ref: '#/components/schemas/Timestamp'

    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          type: string
          nullable: true

    ProbeReport:
      type: object
      description: |
        Ramdisk probe findings — the layout snapshot content in the same
        shape the inband_ssh collector produces (docs/04-install-spec.md §3),
        gathered by the probe environment's /sys scan.
      required: [disks]
      properties:
        captured_at:
          type: string
          format: date-time
        source:
          type: string
        disks:
          type: array
          items:
            type: object
            additionalProperties: true

    TaskLog:
      type: object
      description: One persisted execution log line (docs/08-data-model.md §2).
      required: [id, level, message, ts]
      properties:
        id:
          type: integer
          format: int64
          description: Monotonic within the task; cursor for pagination.
        level:
          type: string
          enum: [DEBUG, INFO, WARN, ERROR]
        stage:
          type: string
          nullable: true
        message:
          type: string
        attrs:
          type: object
          description: Structured log fields beyond stage (machine_id, job_id, code, …).
          additionalProperties: true
          nullable: true
        ts:
          $ref: '#/components/schemas/Timestamp'

    TaskLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskLog'
        next_cursor:
          type: string
          nullable: true

    WebhookCreate:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        secret:
          type: string
          description: HMAC-SHA256 signing secret; server-generated when omitted.
        types:
          type: array
          description: Event types to deliver; empty/omitted delivers all.
          items:
            type: string
        resource_id:
          type: string
          description: Deliver only events of this resource id.

    Webhook:
      type: object
      required: [id, url, enabled, created_at]
      properties:
        id:
          type: string
          pattern: '^wh_[0-9a-z]+$'
        url:
          type: string
          format: uri
        types:
          type: array
          items:
            type: string
        resource_id:
          type: string
          nullable: true
        enabled:
          type: boolean
        watermark:
          type: integer
          format: int64
          description: Last successfully delivered event id.
        fail_count:
          type: integer
          description: Consecutive delivery failures (backoff input).
        created_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookCreated:
      type: object
      required: [id, url, enabled, created_at, secret]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        types:
          type: array
          items:
            type: string
        resource_id:
          type: string
          nullable: true
        enabled:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        secret:
          type: string
          description: The signing secret — shown exactly once, at creation.

    WebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        next_cursor:
          type: string
          nullable: true
