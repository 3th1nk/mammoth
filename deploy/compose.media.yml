# Media overlay: stack the built-in NFS media service on top of the
# all-in-one (or faceted) topology.
#
#   export MAMMOTH_HOST_IP=<host LAN address the BMCs can reach>
#   docker compose -f deploy/compose.all-in-one.yml -f deploy/compose.media.yml up -d
#
# The NFS server shares the `media` volume with mammoth — assembled boot
# ISOs land in the export directly; no upload path exists. The BMC mounts
# nfs://$MAMMOTH_HOST_IP/media, so the export is published on the host's
# LAN address (NFSv3 + mountd + portmapper; BMC firmware overwhelmingly
# speaks NFSv3).
#
# The NFS container runs the in-kernel nfsd, hence privileged, and is
# linux/amd64 — deploy on an amd64 Linux host.
name: mammoth

services:
  nfs:
    image: itsthenetwork/nfs-server-alpine:12
    restart: unless-stopped
    privileged: true # in-kernel nfsd needs module access + mount negotiation
    environment:
      SHARED_DIRECTORY: /media
      SYNC: "true"
    volumes:
      - media:/media
    ports:
      - "2049:2049" # nfs
      - "111:111" # rpcbind/portmapper
      - "20048:20048" # mountd (BMC mount clients usually need `insecure`)

  mammoth:
    volumes:
      - media:/media
    environment:
      # Media lands in the export directly; the BMC mounts it from the
      # host's LAN address. No relay, no settle delay needed in this shape.
      MAMMOTH_MEDIA_DIR: /media
      MAMMOTH_MEDIA_BASE_URI: nfs://${MAMMOTH_HOST_IP:?set MAMMOTH_HOST_IP}/media
      # In-process push is unnecessary when MediaDir IS the export.
      MAMMOTH_MEDIA_RELAY_ADDR: ""

volumes:
  media:
