name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Checks (contract drift, fmt, vet, tests, build)
        run: |
          make contract-check
          make fmt-check
          make vet
          make test
          make build

      - name: Vulnerability scan (govulncheck)
        run: make vuln-check

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mammoth
          POSTGRES_PASSWORD: mammoth
          POSTGRES_DB: mammoth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mammoth -d mammoth"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: PG queue contract suite
        run: make test-pg

      - name: Acceptance flow (all-in-one, fake BMC)
        run: make acceptance

  container:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build images (amd64+arm64)
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: mammoth mammoth-builder
          push: false
